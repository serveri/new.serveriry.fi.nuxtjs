packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - fast-uri@3.1.6
  - colord@2.9.4
  - js-yaml@4.3.2
  - svgo@4.1.0

onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'esbuild'

overrides:
  picomatch@>=4.0.0 <4.0.4: ^4.0.4

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
